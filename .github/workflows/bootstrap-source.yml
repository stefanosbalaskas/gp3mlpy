name: Bootstrap source tree

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/gp3mlpy_repo.tar.gz.b64
          base64 --decode /tmp/gp3mlpy_repo.tar.gz.b64 > /tmp/gp3mlpy_repo.tar.gz
          echo "efd21e81146a533e89e24cecc1f0a151cceb7a2bff14cedc0e43b4d3d0b2a847  /tmp/gp3mlpy_repo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gp3mlpy_repo.tar.gz -C .
          rm -rf bootstrap .bootstrap .github/workflows/bootstrap-source.yml
      - name: Validate reconstructed contract
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          pytest -q
          python scripts/validate_release.py
      - name: Commit reconstructed source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: port gp3ml 0.3.0 to gp3mlpy"
          git push
