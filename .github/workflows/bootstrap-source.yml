name: Bootstrap source tree

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > /tmp/gp3mlpy_repo.tar.gz.b64
          test "$(wc -c < /tmp/gp3mlpy_repo.tar.gz.b64)" -eq 166952
          base64 --decode /tmp/gp3mlpy_repo.tar.gz.b64 > /tmp/gp3mlpy_repo.tar.gz
          test "$(wc -c < /tmp/gp3mlpy_repo.tar.gz)" -eq 125213
          echo "65195655e3827f6af5a0f560e5017000c5e8f2444b6d5e9337ffa27209f7aa2e  /tmp/gp3mlpy_repo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gp3mlpy_repo.tar.gz -C .
      - name: Install core package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Regenerate frozen R reference material
        shell: bash
        run: |
          python scripts/generate_reference_from_r.py
      - name: Validate reconstructed contract
        shell: bash
        run: |
          pytest -q
          python scripts/validate_release.py
      - name: Remove bootstrap payload
        shell: bash
        run: |
          rm -rf bootstrap .bootstrap .github/workflows/bootstrap-source.yml
      - name: Commit reconstructed source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: port gp3ml 0.3.0 to gp3mlpy"
          git push
