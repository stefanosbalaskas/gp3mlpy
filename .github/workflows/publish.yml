name: Publish validated gp3mlpy release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable GitHub release tag, e.g. v0.1.1"
        required: true
        type: string

permissions: {}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify stable release identity
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(
              tomllib.loads(
                  Path("pyproject.toml").read_text(encoding="utf-8")
              )["project"]["version"]
          )
          PY
          )

          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "Tag/version mismatch." >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Tag/checkout commit mismatch." >&2
            exit 1
          fi

          draft=$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft'
          )

          prerelease=$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease \
              --jq '.isPrerelease'
          )

          if [[ "$draft" != "false" ]]; then
            echo "Release is still draft." >&2
            exit 1
          fi

          if [[ "$prerelease" != "false" ]]; then
            echo "Release is still prerelease." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse immutable-version overwrite
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          version = os.environ["RELEASE_VERSION"]

          with urllib.request.urlopen(
              "https://pypi.org/pypi/gp3mlpy/json"
          ) as response:
              data = json.load(response)

          if data.get("releases", {}).get(version):
              raise SystemExit(
                  f"gp3mlpy {version} already exists on PyPI"
              )

          print("PyPI immutable-version check: PASS")
          PY

      - name: Download exact GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "gp3mlpy-${RELEASE_VERSION}-*.whl" \
            --pattern "gp3mlpy-${RELEASE_VERSION}.tar.gz" \
            --pattern "SHA256SUMS.txt"

          test -f dist/SHA256SUMS.txt

          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )

      - name: Validate exact release assets
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install twine
          python -m twine check --strict dist/*.whl dist/*.tar.gz

          wheel=$(
            find dist -maxdepth 1 \
              -name "gp3mlpy-${RELEASE_VERSION}-*.whl" \
              -print -quit
          )

          python -m venv /tmp/gp3mlpy-publish-check
          /tmp/gp3mlpy-publish-check/bin/python -m pip install "$wheel"

          cd /tmp

          RELEASE_VERSION="$RELEASE_VERSION" \
          /tmp/gp3mlpy-publish-check/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          import gp3mlpy

          expected = os.environ["RELEASE_VERSION"]

          assert version("gp3mlpy") == expected
          assert gp3mlpy.__version__ == expected
          assert gp3mlpy.r_reference_version == "0.3.0"

          exports = gp3mlpy.gp3ml_api_contracts().exports

          assert len(exports) == 127
          assert int((exports["stability"] == "stable").sum()) == 71
          assert int((exports["stability"] == "experimental").sum()) == 56

          print("exact release asset validation: PASS")
          PY

      - name: Preserve exact distributions for PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: validated-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: verify-release
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/gp3mlpy

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: validated-pypi-distributions
          path: dist/

      - name: Publish exact validated artifacts
        uses: pypa/gh-action-pypi-publish@release/v1
