name: Publish gp3mlpy release

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      release_needed: ${{ steps.release-meta.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )
          tag="v${version}"
          if [[ "$version" == *dev* || "$version" == *a* || "$version" == *b* || "$version" == *rc* ]]; then
            echo "Refusing to publish non-final version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "GitHub release $tag already exists; publication jobs will be skipped."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Release candidate: $tag"
          fi
      - name: Verify runtime version matches package metadata
        run: |
          python -m pip install -e .
          python - <<'PY'
          import tomllib
          from pathlib import Path
          import gp3mlpy
          expected = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if gp3mlpy.__version__ != expected:
              raise SystemExit(f'Runtime version {gp3mlpy.__version__!r} does not match project version {expected!r}.')
          print(f'package version check: PASS ({expected})')
          PY
      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Enforce 100% line and branch coverage
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest
          --cov=gp3mlpy
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
          -q
      - name: Ruff semantic lint
        run: ruff check src tests examples scripts/build_doc_assets.py
      - name: Public typing contract
        run: mypy --follow-imports=skip src/gp3mlpy/__init__.pyi
      - name: Build strict documentation
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/build_doc_assets.py
          mkdocs build --strict
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload release distributions
        if: steps.release-meta.outputs.release_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build-and-validate
    if: needs.build-and-validate.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-and-validate.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gp3mlpy $RELEASE_VERSION" \
            --generate-notes

  publish-pypi:
    needs: [build-and-validate, github-release]
    if: needs.build-and-validate.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gp3mlpy
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
