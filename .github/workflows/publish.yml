name: Publish gp3mlpy release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify release tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          normalized = tag[1:] if tag.startswith('v') else tag
          if normalized != version:
              raise SystemExit(f'Release tag {tag!r} does not match package version {version!r}.')
          print(f'release version check: PASS ({version})')
          PY
      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Enforce 100% line and branch coverage
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest
          --cov=gp3mlpy
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
          -q
      - name: Ruff semantic lint
        run: ruff check src tests examples scripts/build_doc_assets.py
      - name: Public typing contract
        run: mypy --follow-imports=skip src/gp3mlpy/__init__.pyi
      - name: Build strict documentation
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/build_doc_assets.py
          mkdocs build --strict
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "gp3mlpy $version" \
            --generate-notes

  publish:
    needs: [build-and-validate, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gp3mlpy
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
