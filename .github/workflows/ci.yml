name: CI

on:
  push:
    branches: [main, source-tree]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install coverage dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce 100% line and branch coverage
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest
          --cov=gp3mlpy
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
          -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src/gp3mlpy tests scripts/build_doc_assets.py
      - name: Ruff semantic lint
        run: ruff check src tests examples scripts/build_doc_assets.py
      - name: Public typing contract
        run: mypy --follow-imports=skip src/gp3mlpy/__init__.pyi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[docs]"
      - name: Generate documentation plot assets
        env:
          MPLBACKEND: Agg
        run: python scripts/build_doc_assets.py
      - name: Build strict documentation
        run: mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Install built wheel and verify frozen API
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv /tmp/gp3mlpy-wheel
          /tmp/gp3mlpy-wheel/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/gp3mlpy-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          import gp3mlpy
          assert version("gp3mlpy") == gp3mlpy.__version__
          exports = gp3mlpy.gp3ml_api_contracts().exports
          assert len(exports) == 127
          assert int((exports["stability"] == "stable").sum()) == 71
          assert int((exports["stability"] == "experimental").sum()) == 56
          assert gp3mlpy.r_reference_version == "0.3.0"
          print("installed-wheel API smoke: PASS")
          PY
      - name: Install built sdist and verify frozen API
        shell: bash
        run: |
          set -euo pipefail
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          python -m venv /tmp/gp3mlpy-sdist
          /tmp/gp3mlpy-sdist/bin/python -m pip install "$sdist"
          cd /tmp
          /tmp/gp3mlpy-sdist/bin/python - <<'PY'
          from importlib.metadata import version
          import gp3mlpy
          assert version("gp3mlpy") == gp3mlpy.__version__
          exports = gp3mlpy.gp3ml_api_contracts().exports
          assert len(exports) == 127
          assert int((exports["stability"] == "stable").sum()) == 71
          assert int((exports["stability"] == "experimental").sum()) == 56
          assert gp3mlpy.r_reference_version == "0.3.0"
          print("installed-sdist API smoke: PASS")
          PY
      - name: Preserve tagged candidate distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tagged-distributions-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
