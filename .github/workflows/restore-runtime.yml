name: Restore exact runtime surface

on:
  push:
    branches: [source-tree]
    paths:
      - '.runtime_payload/**'
      - '.github/workflows/restore-runtime.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore exact wheel sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/gp3mlpy
          gzip -dc .runtime_payload/external_validation.py.gz > src/gp3mlpy/external_validation.py
          gzip -dc .runtime_payload/model_tuning.py.gz > src/gp3mlpy/model_tuning.py
          gzip -dc .runtime_payload/nested_resampling.py.gz > src/gp3mlpy/nested_resampling.py
          gzip -dc .runtime_payload/__init__.py.gz > src/gp3mlpy/__init__.py
          gzip -dc .runtime_payload/__init__.pyi.gz > src/gp3mlpy/__init__.pyi
          gzip -dc .runtime_payload/_reference_docs.py.gz > src/gp3mlpy/_reference_docs.py
          cat > /tmp/gp3mlpy-runtime.sha256 <<'EOF'
          12e4c489a5827ba8984d9c2b73a8dd90b42ad81849177390b405fd33529b869b  src/gp3mlpy/external_validation.py
          64b1efd181d055f557ca945a0c210bd0c275d9452f8bc029baf5b63dfc4fe02f  src/gp3mlpy/model_tuning.py
          e6f657cebf5f5a2af227f117ad5c2c2b6ac0a2db73ecd05d1a4b77a4f3b6041a  src/gp3mlpy/nested_resampling.py
          a416456974bf96b4bd886957dabc1744d867d31fde17e97594132de6f9769869  src/gp3mlpy/__init__.py
          b54f24d968c1713140d771f41a84deb0b456a2c8e2c022e5d99a6d68f23f0531  src/gp3mlpy/__init__.pyi
          3b4f45a4b6cad78d82217246cf425cd7614770f8ba53ac704770f375e4a10dde  src/gp3mlpy/_reference_docs.py
          EOF
          sha256sum -c /tmp/gp3mlpy-runtime.sha256
          python -m compileall -q src/gp3mlpy
      - name: Install and verify frozen API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import gp3mlpy
          registry = gp3mlpy.gp3ml_api_contracts()
          assert len(registry.exports) == 127, len(registry.exports)
          assert int((registry.exports['stability'] == 'stable').sum()) == 71
          assert int((registry.exports['stability'] == 'experimental').sum()) == 56
          assert gp3mlpy.r_reference_version == '0.3.0'
          print('gp3mlpy runtime/API smoke: PASS')
          PY
      - name: Commit restored runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime_payload .github/workflows/restore-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete gp3mlpy runtime surface'
          git push origin HEAD:source-tree
