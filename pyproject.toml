[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gp3mlpy"
version = "0.1.0.dev0"
description = "Governance-first leakage-resistant predictive modelling for Gazepoint research workflows; Python port of gp3ml 0.3.0."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Stefanos Balaskas"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1"]
deep = ["keras>=3.10", "tensorflow>=2.21"]
conformal = ["mapie>=1.0"]
rocrate = ["rocrate>=0.14"]
artifact = ["skops>=0.13"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.16", "mypy>=1.17", "build>=1.3", "twine>=6.1"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.30"]
all = ["xgboost>=2.1", "keras>=3.10", "tensorflow>=2.21", "mapie>=1.0", "rocrate>=0.14", "skops>=0.13"]

[project.urls]
Homepage = "https://stefanosbalaskas.github.io/gp3mlpy/"
Repository = "https://github.com/stefanosbalaskas/gp3mlpy"
R-Reference = "https://github.com/stefanosbalaskas/gp3ml"

[tool.hatch.build.targets.wheel]
packages = ["src/gp3mlpy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# The parity candidate blocks on semantic Pyflakes diagnostics. The upstream
# port intentionally preserves compact R-derived implementation structure, so
# formatting/import-order/modernization rules (E/I/UP) and opinionated bugbear
# style rules are tracked as a later source-hardening tranche rather than being
# allowed to force broad, semantics-risking rewrites during parity freeze.
[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
