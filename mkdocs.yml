site_name: gp3mlpy
site_author: Stefanos Balaskas
site_description: Governance-first, leakage-resistant predictive modelling for Gazepoint research workflows in Python
site_url: https://stefanosbalaskas.github.io/gp3mlpy/
repo_url: https://github.com/stefanosbalaskas/gp3mlpy
repo_name: stefanosbalaskas/gp3mlpy
copyright: Copyright © 2026 Stefanos Balaskas · MIT licensed

edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  logo: assets/python-suite-logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/polish.css
  - stylesheets/contrast.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/gp3mlpy
      name: gp3mlpy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gp3mlpy/
      name: gp3mlpy on PyPI
    - icon: fontawesome/solid/archive
      link: https://doi.org/10.5281/zenodo.22206729
      name: gp3mlpy on Zenodo

nav:
  - Home: index.md
  - Start:
      - Quickstart: getting-started.md
      - Key concepts: key-concepts.md
  - Workflows:
      - Overview: articles/index.md
      - Start here:
          - Integrated research workflow: articles/integrated-research-workflow.md
          - Assigned-condition discrimination: articles/assigned-condition-discrimination.md
          - Recording-quality review: articles/recording-quality-review.md
      - Generalization and resampling:
          - Participant generalization: articles/participant-generalization.md
          - Stimulus generalization: articles/stimulus-generalization.md
          - Participant-stimulus generalization: articles/participant-stimulus-generalization.md
          - Nested grouped resampling: articles/nested-grouped-resampling.md
          - Group-aware conformal prediction: articles/group-aware-conformal-prediction.md
      - Governance and planning:
          - Analysis-plan governance: articles/analysis-plan-governance.md
          - Governance standards profile: articles/governance-standards-profile.md
          - Decision governance: articles/decision-governance.md
          - API stability contracts: articles/api-stability-contracts.md
      - Validation and robustness:
          - External validation reporting: articles/external-validation-reporting.md
          - Dataset shift and robustness: articles/dataset-shift-and-robustness.md
          - Contaminated-manifest leakage: articles/contaminated-manifest-leakage.md
          - Observed behavioral endpoint: articles/observed-behavioral-endpoint.md
      - Reproducibility and interoperability:
          - Reproducibility hardening: articles/reproducibility-hardening.md
          - Portable research artifacts: articles/portable-research-artifacts.md
          - Cross-package interoperability: articles/cross-package-interoperability.md
          - Optional-engine portability: articles/optional-engine-portability.md
  - Diagnostics:
      - Plot gallery: plots.md
  - Reference:
      - Workflow API map: api-map.md
      - Complete API index: reference/index.md
